<div class="container mt-5">

  <div class="card shadow">

    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">Registrar Operación</h3>
    </div>

    <div class="card-body">

      <form (ngSubmit)="registrarOperacion()">

        <div class="mb-3">
          <label class="form-label">Operación</label>
          <input
            type="text"
            class="form-control"
            name="operacion"
            [(ngModel)]="operacion.operacion"
            placeholder="Ejemplo: venta"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Importe</label>
          <input
            type="number"
            step="0.01"
            class="form-control"
            name="importe"
            [(ngModel)]="operacion.importe"
            placeholder="100.00"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Cliente</label>
          <input
            type="text"
            class="form-control"
            name="cliente"
            [(ngModel)]="operacion.cliente"
            placeholder="Nombre del cliente"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Secreto</label>
          <input
            type="text"
            class="form-control"
            name="secreto"
            [(ngModel)]="operacion.secreto"
            placeholder="Texto secreto"
            required>
        </div>

        <div class="d-grid">
          <button
            type="submit"
            class="btn btn-success">
            Registrar Operación
          </button>
        </div>

      </form>

      <div
        *ngIf="mensaje"
        class="alert alert-info mt-4">

        {{ mensaje }}

      </div>

    </div>

  </div>

</div>
